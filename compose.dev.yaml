name: bitnp-pass-dev

services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: bitnp
      POSTGRES_PASSWORD: bitnp
      POSTGRES_DB: bitnp9
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./dev/postgres-init.sh:/docker-entrypoint-initdb.d/bitnp.sh:ro
    healthcheck:
      test:
        ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bitnp", "-d", "bitnp9"]
      interval: 2s
      timeout: 5s
      retries: 30

  keycloak9:
    image: quay.io/keycloak/keycloak:9.0.0
    profiles: [keycloak9]
    environment:
      DB_VENDOR: h2
      KEYCLOAK_FRONTEND_URL: http://localhost:8080/auth
    command:
      - -b
      - 0.0.0.0
      - -Dkeycloak.profile.feature.account_api=enabled
      - -Dkeycloak.migration.action=import
      - -Dkeycloak.migration.provider=singleFile
      - -Dkeycloak.migration.file=/tmp/master-realm.json
      - -Dkeycloak.migration.strategy=IGNORE_EXISTING
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak9-data:/opt/jboss/keycloak/standalone/data
      - ./dev/master-realm.json:/tmp/master-realm.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /auth/realms/master/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

  keycloak26:
    image: quay.io/keycloak/keycloak:26.7.3
    profiles: [keycloak26]
    environment:
      KC_HOSTNAME: http://localhost:8080
    command:
      - start-dev
      - --import-realm
      - --spi-user-profile--declarative-user-profile--config-file=/opt/keycloak/conf/user-profile.json
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - keycloak26-data:/opt/keycloak/data
      - ./dev/master-realm.json:/opt/keycloak/data/import/master-realm.json:ro
      - ./dev/user-profile.json:/opt/keycloak/conf/user-profile.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /realms/master/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

volumes:
  postgres-data:
  keycloak9-data:
  keycloak26-data:
