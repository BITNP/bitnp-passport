name: bitnp-passport-dev

services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: bitnp
      POSTGRES_PASSWORD: bitnp
      POSTGRES_DB: bitnp26
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bitnp", "-d", "bitnp26"]
      interval: 2s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    environment:
      KC_HOSTNAME: http://localhost:8080
    command:
      - start-dev
      - --import-realm
      - --spi-user-profile--declarative-user-profile--config-file=/opt/keycloak/conf/user-profile.json
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - keycloak26-data:/opt/keycloak/data
      - ./dev/master-realm.json:/opt/keycloak/data/import/master-realm.json:ro
      - ./dev/user-profile.json:/opt/keycloak/conf/user-profile.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /realms/master/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

volumes:
  postgres-data:
  keycloak26-data:
